# Menjaga proyek Supabase gratis agar tidak di-pause karena tidak aktif.
# Butuh dua "secrets" di GitHub: SUPABASE_URL dan SUPABASE_ANON_KEY.
name: keepalive
on:
  schedule: [{ cron: '17 3 */3 * *' }]   # tiap 3 hari
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Sentuh database
        env: { URL: '${{ secrets.SUPABASE_URL }}', KEY: '${{ secrets.SUPABASE_ANON_KEY }}' }
        run: |
          test -n "$URL" && test -n "$KEY"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/site_settings?select=key&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $code"; test "$code" = "200"
